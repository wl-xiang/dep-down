name: Npm Download

on:
  workflow_dispatch:
    inputs:
      packages:
        description: 'Content of packages.txt. One package per line; use $ to represent a newline (e.g. vue$axios$react). Leave empty to use the repo file selected by "source".'
        type: string
        required: false
        default: ''
      source:
        description: 'Repo file to download from when "packages" is empty'
        type: choice
        required: true
        default: 'packages.txt'
        options:
          - 'packages.txt'
          - 'package.json'
      registry:
        description: 'npm registry mirror'
        type: choice
        required: true
        default: 'npmmirror (taobao)'
        options:
          - 'npmmirror (taobao)'
          - 'Tencent'
          - 'Huawei'
          - 'THU (tuna)'
          - 'USTC'
          - 'Official (npmjs.org)'
          - 'Other (custom URL)'
      custom_registry_url:
        description: 'Custom npm registry URL (used only when registry is "Other (custom URL)")'
        type: string
        required: false
        default: ''
      node_version:
        description: 'Node.js version used to run npm-offline-packager (npo)'
        type: choice
        required: true
        default: '20'
        options:
          - '18'
          - '20'
          - '22'
          - '24'

permissions:
  contents: read

jobs:
  npm-download:
    name: Download npm packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resolve npm registry URL
        id: registry
        env:
          NPM_REGISTRY: ${{ inputs.registry }}
          CUSTOM_REGISTRY_URL: ${{ inputs.custom_registry_url }}
        run: |
          set -euo pipefail
          case "$NPM_REGISTRY" in
            'npmmirror (taobao)')   url='https://registry.npmmirror.com' ;;
            'Tencent')              url='https://mirrors.cloud.tencent.com/npm/' ;;
            'Huawei')               url='https://repo.huaweicloud.com/repository/npm/' ;;
            'THU (tuna)')           url='https://mirrors.tuna.tsinghua.edu.cn/npm/' ;;
            'USTC')                 url='https://mirrors.ustc.edu.cn/npm/' ;;
            'Official (npmjs.org)') url='https://registry.npmjs.org' ;;
            'Other (custom URL)')
              url="$(printf '%s' "$CUSTOM_REGISTRY_URL" | tr -d '[:space:]')"
              if [ -z "$url" ]; then
                echo '::error::registry is "Other (custom URL)" but custom_registry_url is empty.'
                exit 1
              fi
              ;;
            *)
              echo "::error::Unknown registry value: $NPM_REGISTRY"
              exit 1
              ;;
          esac
          echo "Using npm registry: $url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install click jinja2

      - name: Install npm-offline-packager
        env:
          REGISTRY_URL: ${{ steps.registry.outputs.url }}
        run: |
          set -euo pipefail
          npm install -g --registry "$REGISTRY_URL" npm-offline-packager
          npo --version

      - name: Write packages.txt from input
        if: ${{ inputs.packages != '' }}
        env:
          PACKAGES: ${{ inputs.packages }}
        run: |
          set -euo pipefail
          printf '%s\n' "$(printf '%s' "$PACKAGES" | sed 's/\$/\n/g')" > scripts/npm/packages.txt
          if ! grep -qE '[^[:space:]]' scripts/npm/packages.txt; then
            echo '::error::The packages input contains only whitespace.'
            exit 1
          fi
          echo '--- scripts/npm/packages.txt (from input) ---'
          cat scripts/npm/packages.txt

      - name: Download npm packages
        env:
          REGISTRY_URL: ${{ steps.registry.outputs.url }}
          SOURCE: ${{ inputs.source }}
          HAS_INPUT: ${{ inputs.packages != '' }}
        run: |
          set -euo pipefail
          if [ "$SOURCE" = 'package.json' ] && [ "$HAS_INPUT" != 'true' ]; then
            # 使用仓库内的 package.json；置空 PT 以覆盖 .env.npm 中 packages.txt 的默认值
            export PT=''
            python scripts/npm/npo_fetch.py \
              -d ./packages \
              --registry "$REGISTRY_URL" \
              -p scripts/npm/package.json \
              --need-pack 2>&1 | tee download.log
          else
            python scripts/npm/npo_fetch.py \
              -d ./packages \
              --registry "$REGISTRY_URL" \
              --pt scripts/npm/packages.txt \
              --need-pack 2>&1 | tee download.log
          fi
          # npo_fetch.py 会吞掉底层失败并仍以 0 退出，因此扫描日志。
          if grep -nE '^ERROR|^Error:|下载失败|Error:' download.log; then
            echo '::error::npm download reported errors (see matching lines above).'
            exit 1
          fi

      - name: Verify packages
        run: |
          set -euo pipefail
          shopt -s nullglob
          tgzs=(packages/*.tgz packages/*/*.tgz)
          if [ ${#tgzs[@]} -eq 0 ]; then
            echo '::error::No *.tgz files found in packages/.'
            exit 1
          fi
          echo "Downloaded ${#tgzs[@]} package tarball(s):"
          ls -1 packages/
          if [ ! -f packages/package.json ]; then
            echo '::error::packages/package.json is missing (needed for offline install).'
            exit 1
          fi

      - name: Generate offline install manifest and README
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import tarfile
          from pathlib import Path

          dest = Path("packages")
          tarballs = sorted(dest.glob("*.tgz")) + sorted(dest.glob("*/*.tgz"))
          deps = {}
          versions = {}
          for tgz in tarballs:
              meta = None
              with tarfile.open(tgz, "r:gz") as tar:
                  for member in tar.getmembers():
                      if member.name in ("package/package.json", "package.json"):
                          meta = json.loads(tar.extractfile(member).read().decode("utf-8"))
                          break
              if not meta or not meta.get("name"):
                  raise SystemExit(f"cannot read a package name from {tgz}")
              deps[meta["name"]] = "file:./" + tgz.relative_to(dest).as_posix()
              versions[meta["name"]] = meta.get("version", "")
          if not deps:
              raise SystemExit("no *.tgz files found in packages/")
          manifest = {
              "name": "npm-offline-packages",
              "version": "1.0.0",
              "private": False,
              "description": "Offline install manifest: every dependency resolves to a local tarball, so `npm install --offline` never contacts a registry.",
              "dependencies": dict(sorted(deps.items())),
          }
          (dest / "package.json").write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          print(f"Wrote packages/package.json with {len(deps)} local file: dependencies")

          pkg_list = "\n".join(
              "- `%s`%s" % (name, "@" + versions[name] if versions[name] else "")
              for name in sorted(deps)
          )
          template = Path("scripts/npm/README.template.md").read_text(encoding="utf-8")
          readme = template.replace("__TARBALL_COUNT__", str(len(deps))).replace(
              "__PACKAGE_LIST__", pkg_list
          )
          (dest / "README.md").write_text(readme, encoding="utf-8")
          print("Wrote packages/README.md")
          PY
          if [ ! -f packages/README.md ]; then
            echo '::error::packages/README.md is missing.'
            exit 1
          fi

      - name: Stage artifact as a top-level packages/ folder
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist
          cp -r packages dist/packages
          echo 'Artifact will extract to a top-level packages/ folder:'
          ls -1 dist/

      - name: Upload packages artifact
        uses: actions/upload-artifact@v4
        with:
          name: npm_packages
          path: dist
          if-no-files-found: error

      - name: Generate workflow summary
        env:
          REGISTRY_URL: ${{ steps.registry.outputs.url }}
          NPM_REGISTRY: ${{ inputs.registry }}
          SOURCE: ${{ inputs.source }}
          HAS_INPUT: ${{ inputs.packages != '' }}
          NODE_VERSION: ${{ inputs.node_version }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          # 本次请求的包列表。
          if [ "$HAS_INPUT" = 'true' ]; then
            req_list="$(grep -vE '^[[:space:]]*(#|$)' scripts/npm/packages.txt | sed 's/^[[:space:]]*/- /' || true)"
            req_source='packages input'
          elif [ "$SOURCE" = 'package.json' ]; then
            req_list="$(python3 -c 'import json; d = json.load(open("scripts/npm/package.json", encoding="utf-8"))["dependencies"]; print("\n".join("- %s (%s)" % (k, v) for k, v in d.items()))')"
            req_source='scripts/npm/package.json'
          else
            req_list="$(grep -vE '^[[:space:]]*(#|$)' scripts/npm/packages.txt | sed 's/^[[:space:]]*/- /' || true)"
            req_source='scripts/npm/packages.txt'
          fi
          if [ -z "$req_list" ]; then
            req_list='- (none)'
          fi

          # 已下载的 tarball。
          tarball_lines=''
          tarball_count=0
          for tgz in packages/*.tgz packages/*/*.tgz; do
            tarball_lines+="- \`$(basename "$tgz")\`"$'\n'
            tarball_count=$((tarball_count + 1))
          done
          if [ -z "$tarball_lines" ]; then
            tarball_lines='- (none)'
          fi

          {
            echo "## Npm download summary"
            echo ""
            echo "| Item | Value |"
            echo "| --- | --- |"
            echo "| Requested from | \`$req_source\` |"
            echo "| npm registry preset | \`$NPM_REGISTRY\` |"
            echo "| npm registry URL | $REGISTRY_URL |"
            echo "| Node.js version | \`$NODE_VERSION\` |"
            echo "| Tool | \`npm-offline-packager (npo)\` |"
            echo ""
            echo "### Requested packages"
            echo ""
            echo "$req_list"
            echo ""
            echo "### Downloaded tarballs ($tarball_count file(s))"
            echo ""
            printf '%s' "$tarball_lines"
            echo ""
            echo "### Offline install guide"
            echo ""
            echo "Download the \`npm_packages\` artifact and extract it. The archive contains a single top-level \`packages/\` folder, so nothing gets scattered into your current directory. On the offline machine, install with zero network access:"
            echo ""
            echo '```bash'
            echo "cd packages"
            echo "npm install --offline"
            echo '```'
            echo ""
            echo "The bundled \`packages/package.json\` declares every dependency as a local tarball (\`file:./xxx.tgz\`), so npm resolves the whole tree from files on disk and never contacts any registry."
            echo ""
            echo "Prefer installing straight into your own project? From your project root:"
            echo ""
            echo '```bash'
            echo "# bash / Git Bash"
            echo "npm install ./packages/*.tgz --offline"
            echo '```'
            echo ""
            echo "On Windows PowerShell:"
            echo ""
            echo '```powershell'
            echo "npm install (Get-ChildItem ./packages/*.tgz).FullName --offline"
            echo '```'
            echo ""
            echo "> If you hit \`npm error class extends value undefined is not a constructor or null\`, that points to a broken or version-mismatched Node.js + npm installation on the offline machine (npm's own bundled modules fail to load), not to these packages — any npm command would fail the same way. Reinstall Node.js and clear stale global npm directories so \`node -v\` and \`npm -v\` are consistent."
            echo ""
            echo "The \`packages/\` folder is also a valid \`package.json\` project (\`private\` is \`false\`), so it can be published to a private registry (\`npm publish\`) or imported into Verdaccio for team-wide offline use — see \`docs/npm-offline-package-guide.md\`."
            echo ""
            echo "A \`packages/README.md\` is bundled in the artifact with the same offline install guide plus the commands for publishing to a local Verdaccio:"
            echo ""
            echo '```bash'
            echo "cd packages"
            echo "npm login --registry http://localhost:4873"
            echo "npm publish --registry http://localhost:4873"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          echo 'Workflow summary written to $GITHUB_STEP_SUMMARY'
