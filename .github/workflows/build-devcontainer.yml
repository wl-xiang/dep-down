name: Build DevContainer

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Target platform (must match the offline machine CPU architecture)'
        type: choice
        required: true
        default: 'linux-amd64'
        options:
          - 'linux-amd64'
          - 'linux-arm64'
      python_version:
        description: 'Target Python version'
        type: choice
        required: true
        default: '3.13'
        options:
          - '3.12'
          - '3.13'
      glibc_version:
        description: 'Target glibc version (controls the manylinux tag used by pip download)'
        type: choice
        required: true
        default: '2.28'
        options:
          - '2.17'
          - '2.28'
          - '2.34'
      pip_mirror:
        description: 'Pip index mirror'
        type: choice
        required: true
        default: 'thu'
        options:
          - 'pypi.org'
          - 'aliyun'
          - 'thu'
      pip_packages:
        description: 'Pip packages, separated by $ (e.g. numpy$pandas$requests). Leave empty for no extra packages.'
        type: string
        required: false
        default: ''
      apt_packages:
        description: 'APT packages, space separated (e.g. git vim curl)'
        type: string
        required: false
        default: ''
      custom_install_cmd:
        description: 'Custom install command executed in the prod image (e.g. curl https://xxx/install.sh | bash)'
        type: string
        required: false
        default: ''
      enable_nginx:
        description: 'Enable nginx sidecar service (8080:80)'
        type: boolean
        required: true
        default: false
      enable_postgres:
        description: 'Enable postgres sidecar service (postgres:16)'
        type: boolean
        required: true
        default: false
      app_depends_on_nginx:
        description: 'app service depends_on nginx (requires enable_nginx)'
        type: boolean
        required: true
        default: false
      app_depends_on_postgres:
        description: 'app service depends_on postgres (requires enable_postgres)'
        type: boolean
        required: true
        default: false
      prod_command:
        description: 'Command run by the prod service'
        type: string
        required: true
        default: 'python main.py'
      build_dev_image:
        description: 'Also build the dev image (ruff/pytest/tools, inherits prod)'
        type: boolean
        required: true
        default: true
      dev_image_only:
        description: 'Only build the dev image (no separate prod/dev images; deployment also uses the dev image; the bundle contains only the dev image). Overrides build_dev_image.'
        type: boolean
        required: true
        default: false
      image_prefix:
        description: 'Image name prefix (produces <prefix>-prod:<tag> and <prefix>-dev:<tag>)'
        type: string
        required: true
        default: 'devcontainer'
      app_source_dir:
        description: 'Subdirectory of the project root mounted into the container as /app (default "." = whole root; the project root is passed to install.sh at install time)'
        type: string
        required: true
        default: '.'
      app_port:
        description: 'Port the app listens on inside the container (empty = no port mapping; with nginx it is reverse-proxied)'
        type: string
        required: false
        default: ''
      env_file:
        description: 'Env file(s) injected into the app service, comma/space separated (e.g. .env)'
        type: string
        required: false
        default: ''
      selinux_relabel:
        description: 'Append :z to the /app bind mount (needed on SELinux enforcing hosts)'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  build-devcontainer:
    name: Build offline dev images
    # linux-arm64 使用 ARM 原生 Runner（ubuntu-24.04-arm：公共仓库免费，
    # 私有仓库按分钟计费），免去 QEMU 模拟（速度约为原生 1/5~1/10）；
    # amd64 走标准 x86_64 Runner。
    runs-on: ${{ inputs.platform == 'linux-arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: devcontainer-pip-${{ inputs.platform }}-py${{ inputs.python_version }}-${{ inputs.glibc_version }}-${{ inputs.pip_packages }}
          restore-keys: |
            devcontainer-pip-${{ inputs.platform }}-py${{ inputs.python_version }}-${{ inputs.glibc_version }}-

      # 无需 QEMU：runner 架构已与目标平台一致（amd64 → x86_64 Runner，
      # arm64 → ubuntu-24.04-arm），docker build 全程原生执行
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and package
        id: build
        env:
          PLATFORM: ${{ inputs.platform }}
          PYTHON_VERSION: ${{ inputs.python_version }}
          GLIBC_VERSION: ${{ inputs.glibc_version }}
          PIP_MIRROR: ${{ inputs.pip_mirror }}
          PIP_PACKAGES: ${{ inputs.pip_packages }}
          APT_PACKAGES: ${{ inputs.apt_packages }}
          CUSTOM_INSTALL_CMD: ${{ inputs.custom_install_cmd }}
          ENABLE_NGINX: ${{ inputs.enable_nginx }}
          ENABLE_POSTGRES: ${{ inputs.enable_postgres }}
          APP_DEPENDS_ON_NGINX: ${{ inputs.app_depends_on_nginx }}
          APP_DEPENDS_ON_POSTGRES: ${{ inputs.app_depends_on_postgres }}
          PROD_COMMAND: ${{ inputs.prod_command }}
          BUILD_DEV_IMAGE: ${{ inputs.build_dev_image }}
          DEV_IMAGE_ONLY: ${{ inputs.dev_image_only }}
          IMAGE_PREFIX: ${{ inputs.image_prefix }}
          APP_SOURCE_DIR: ${{ inputs.app_source_dir }}
          APP_PORT: ${{ inputs.app_port }}
          ENV_FILE: ${{ inputs.env_file }}
          SELINUX_RELABEL: ${{ inputs.selinux_relabel }}
        run: python scripts/devcontainer-builder/main.py

      - name: Verify artifacts
        run: |
          set -euo pipefail
          echo "--- ${{ steps.build.outputs.src_name }} (top entries) ---"
          # List to a file first: piping tar into head triggers SIGPIPE (exit 2) under pipefail
          tar tzf "${{ steps.build.outputs.src_tgz }}" > /tmp/src_tgz.list
          head -30 /tmp/src_tgz.list
          echo "... $(wc -l < /tmp/src_tgz.list) entries total"
          # install.sh 依赖的关键文件必须存在
          grep -q 'devcontainer-src/docker-compose.yml.tpl$' /tmp/src_tgz.list \
            || { echo "::error::src 包缺少 docker-compose.yml.tpl"; exit 1; }
          grep -q 'devcontainer-src/main.py$' /tmp/src_tgz.list \
            || { echo "::error::src 包缺少占位 main.py"; exit 1; }
          # 离线补装机制（build.sh + Dockerfile.addon）
          grep -q 'devcontainer-src/Dockerfile.addon$' /tmp/src_tgz.list \
            || { echo "::error::src 包缺少 Dockerfile.addon"; exit 1; }
          grep -q 'devcontainer-src/build.sh$' /tmp/src_tgz.list \
            || { echo "::error::src 包缺少 build.sh"; exit 1; }
          echo "--- checksum (与 Summary 表格中的 SHA256 对比) ---"
          sha256sum "${{ steps.build.outputs.src_tgz }}"
          if [ -n "${{ steps.build.outputs.install_sh }}" ]; then
            echo "--- install.sh ---"
            test -x "${{ steps.build.outputs.install_sh }}" \
              || { echo "::error::install.sh 缺少可执行权限"; exit 1; }
            bash -n "${{ steps.build.outputs.install_sh }}"
            sha256sum "${{ steps.build.outputs.install_sh }}"
          else
            echo "::error::install.sh 未生成"
            exit 1
          fi
          echo "--- build.sh (from src tgz) ---"
          tar xzf "${{ steps.build.outputs.src_tgz }}" -O devcontainer-src/build.sh > /tmp/build.sh
          bash -n /tmp/build.sh
          # tar 需保留可执行位（artifact zip 解压可能丢失，文档引导 bash 调用）
          tar tvzf "${{ steps.build.outputs.src_tgz }}" devcontainer-src/build.sh \
            | grep -q '^-[rwx-]*x' \
            || { echo "::error::src 包内 build.sh 无可执行权限"; exit 1; }
          if [ -n "${{ steps.build.outputs.bundle_tgz }}" ]; then
            echo "--- ${{ steps.build.outputs.bundle_name }} ---"
            # bundle 是 gzip 压缩的镜像归档：根目录必须能直接看到 manifest.json（或 OCI index.json）
            tar tzf "${{ steps.build.outputs.bundle_tgz }}" > /tmp/bundle.list
            head -20 /tmp/bundle.list
            if ! grep -qE '^(\./)?(manifest\.json|index\.json)$' /tmp/bundle.list; then
              echo "::error::bundle 顶层缺少 manifest.json / index.json，docker load 会失败"
              exit 1
            fi
            sha256sum "${{ steps.build.outputs.bundle_tgz }}"
          else
            echo "bundle artifact skipped (DEVCONTAINER_SKIP_DOCKER was set)"
          fi

      # 安装脚本：构建时已 chmod 755，此处显式再确认一次
      # （注：artifact zip 解压后可能丢失 +x，文档统一引导用户 bash install.sh 调用）
      - name: Make install.sh executable
        run: chmod +x "${{ steps.build.outputs.install_sh }}"

      # Artifacts 只能是 zip 封装：设 compression-level 0 让 zip 只做存储，
      # 避免 tgz 再被 zip 二次压缩。src artifact 同时包含 src tgz 与 install.sh
      # 两个文件（均在 dist/ 下，zip 解压后即得这两个文件），加上 bundle 共两个产物
      - name: Upload src artifact (src tgz + install.sh)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.src_name }}
          path: |
            ${{ steps.build.outputs.src_tgz }}
            ${{ steps.build.outputs.install_sh }}
          compression-level: 0
          if-no-files-found: error

      - name: Upload bundle artifact
        if: ${{ steps.build.outputs.bundle_tgz != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.bundle_name }}
          path: ${{ steps.build.outputs.bundle_tgz }}
          compression-level: 0
          if-no-files-found: error
