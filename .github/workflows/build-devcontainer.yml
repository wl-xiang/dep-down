name: Build DevContainer

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Target platform'
        type: choice
        required: true
        default: 'linux-arm64'
        options:
          - 'linux-amd64'
          - 'linux-arm64'
      python_version:
        description: 'Target Python version'
        type: choice
        required: true
        default: '3.13'
        options:
          - '3.12'
          - '3.13'
      glibc_version:
        description: 'Target glibc version (controls the manylinux tag used by pip download)'
        type: choice
        required: true
        default: '2.28'
        options:
          - '2.17'
          - '2.28'
          - '2.34'
      pip_mirror:
        description: 'Pip index mirror'
        type: choice
        required: true
        default: 'thu'
        options:
          - 'pypi.org'
          - 'aliyun'
          - 'thu'
      pip_packages:
        description: 'Pip packages, separated by $ (e.g. numpy$pandas$requests). Leave empty for no extra packages.'
        type: string
        required: false
        default: ''
      apt_packages:
        description: 'APT packages, space separated (e.g. git vim curl)'
        type: string
        required: false
        default: ''
      custom_install_cmd:
        description: 'Custom install command executed in the prod image (e.g. curl https://xxx/install.sh | bash)'
        type: string
        required: false
        default: ''
      name:
        description: '名称：镜像与产物的命名前缀，留空默认 devcontainer'
        type: string
        required: false
        default: ''
      tag:
        description: '镜像与产物的 tag'
        type: string
        required: false
        default: 'latest'
      enable_nginx:
        description: 'Enable nginx sidecar service (8080:80)'
        type: boolean
        required: true
        default: false
      enable_postgres:
        description: 'Enable postgres sidecar service (postgres:16)'
        type: boolean
        required: true
        default: false
      app_depends_on_nginx:
        description: 'app service depends_on nginx (requires enable_nginx)'
        type: boolean
        required: true
        default: false
      app_depends_on_postgres:
        description: 'app service depends_on postgres (requires enable_postgres)'
        type: boolean
        required: true
        default: false
      build_dev_image:
        description: 'Also build the dev image (ruff/pytest/tools, inherits prod)'
        type: boolean
        required: true
        default: true
      app_source_dir:
        description: 'Source directory mounted into the container as /app (relative to the compose file)'
        type: string
        required: true
        default: '.'

permissions:
  contents: read

jobs:
  build-devcontainer:
    name: Build offline dev images
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: devcontainer-pip-${{ inputs.platform }}-py${{ inputs.python_version }}-${{ inputs.glibc_version }}-${{ inputs.pip_packages }}
          restore-keys: |
            devcontainer-pip-${{ inputs.platform }}-py${{ inputs.python_version }}-${{ inputs.glibc_version }}-

      - name: Set up QEMU (cross-arch builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and package
        id: build
        env:
          PLATFORM: ${{ inputs.platform }}
          PYTHON_VERSION: ${{ inputs.python_version }}
          GLIBC_VERSION: ${{ inputs.glibc_version }}
          PIP_MIRROR: ${{ inputs.pip_mirror }}
          PIP_PACKAGES: ${{ inputs.pip_packages }}
          APT_PACKAGES: ${{ inputs.apt_packages }}
          CUSTOM_INSTALL_CMD: ${{ inputs.custom_install_cmd }}
          ENABLE_NGINX: ${{ inputs.enable_nginx }}
          ENABLE_POSTGRES: ${{ inputs.enable_postgres }}
          APP_DEPENDS_ON_NGINX: ${{ inputs.app_depends_on_nginx }}
          APP_DEPENDS_ON_POSTGRES: ${{ inputs.app_depends_on_postgres }}
          BUILD_DEV_IMAGE: ${{ inputs.build_dev_image }}
          NAME: ${{ inputs.name }}
          TAG: ${{ inputs.tag }}
          APP_SOURCE_DIR: ${{ inputs.app_source_dir }}
        run: python scripts/devcontainer-builder/main.py

      - name: Verify artifacts
        run: |
          set -euo pipefail
          echo "--- ${{ steps.build.outputs.src_name }}: artifact zip 将包含的文件夹 ---"
          find "${{ steps.build.outputs.src_dir }}" -mindepth 1 -maxdepth 1
          echo "--- src 目录文件清单 ---"
          (cd "${{ steps.build.outputs.src_dir }}" && find . -type f | sort)
          if [ -n "${{ steps.build.outputs.bundle_tar }}" ]; then
            echo "--- ${{ steps.build.outputs.bundle_name }}: images.tar 校验 ---"
            ls -lh "${{ steps.build.outputs.bundle_tar }}"
            # List to a file first: piping tar into head triggers SIGPIPE (exit 2) under pipefail
            tar tf "${{ steps.build.outputs.bundle_tar }}" > /tmp/images_tar.list
            head -20 /tmp/images_tar.list
            echo "... $(wc -l < /tmp/images_tar.list) entries total"
          else
            echo "bundle artifact skipped (DEVCONTAINER_SKIP_DOCKER was set)"
          fi

      # GitHub artifact 本身就是 zip：
      # - src 上传 dist/out（其内唯一子文件夹即 <name>/），下载解压即得名称文件夹
      # - bundle 直接上传 images.tar，下载解压即得 images.tar（不再套 tgz 中间层）
      - name: Upload src artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.src_name }}
          path: ${{ steps.build.outputs.src_dir }}
          if-no-files-found: error

      - name: Upload bundle artifact
        if: ${{ steps.build.outputs.bundle_tar != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.bundle_name }}
          path: ${{ steps.build.outputs.bundle_tar }}
          compression-level: 0
          if-no-files-found: error
