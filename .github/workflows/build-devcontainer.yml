name: Build DevContainer

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Target platform (must match the offline machine CPU architecture)'
        type: choice
        required: true
        default: 'linux-amd64'
        options:
          - 'linux-amd64'
          - 'linux-arm64'
      python_version:
        description: 'Target Python version'
        type: choice
        required: true
        default: '3.13'
        options:
          - '3.10'
          - '3.11'
          - '3.12'
          - '3.13'
      pip_packages:
        description: 'Pip packages, separated by $ (e.g. numpy$pandas$requests). Leave empty for no extra packages.'
        type: string
        required: false
        default: ''
      apt_packages:
        description: 'APT packages, space separated (e.g. git vim curl)'
        type: string
        required: false
        default: ''
      custom_install_cmd:
        description: 'Custom install command executed in the prod image (e.g. curl https://xxx/install.sh | bash)'
        type: string
        required: false
        default: ''
      enable_lucide:
        description: 'Preinstall lucide (SVG icon library for Django/Jinja templates, pip package)'
        type: boolean
        required: true
        default: false
      enable_oracle_instantclient:
        description: 'Oracle Instant Client 19 mode: none = install nothing; runtime_deps_only = runtime deps (libaio1/libnsl2) + env vars only, the client itself is bind-mounted from the host at /opt/oracle/instantclient19 by docker-compose; full = install the client + runtime deps into the image (downloaded at build time from the official Oracle URL)'
        type: choice
        required: true
        default: 'none'
        options:
          - 'none'
          - 'runtime_deps_only'
          - 'full'
      preset_envs:
        description: 'Preset env vars injected into app/dev services, multiple separated by a single 》 (e.g. DB_HOST=10.0.0.1》DB_PORT=1521)'
        type: string
        required: false
        default: ''
      enable_node:
        description: 'Install Node.js + npm into the image for offline frontend development (vite/webpack/vue/react)'
        type: boolean
        required: true
        default: false
      npm_packages:
        description: 'npm packages installed globally at build time, separated by $ (e.g. vite$webpack$webpack-cli$vue$react). Requires enable_node.'
        type: string
        required: false
        default: ''
      npm_packages_dir:
        description: 'Host folder holding the Npm Download artifact (its packages/ content: *.tgz + package.json). It is mounted read-only at /opt/npm-packages so `make npm-install` can install frontend dependencies offline. Relative to the project root or absolute. Requires enable_node.'
        type: string
        required: true
        default: 'packages'
      sidecars:
        description: 'Sidecar services to enable: nginx (8080:80) and/or postgres (postgres:16), separated by comma/space. Empty = none.'
        type: string
        required: false
        default: ''
      app_depends_on:
        description: 'Sidecar services the app waits for: nginx and/or postgres, separated by comma/space. Requires the matching sidecar.'
        type: string
        required: false
        default: ''
      prod_command:
        description: 'Command run by the prod service'
        type: string
        required: true
        default: 'python main.py'
      image_mode:
        description: 'prod+dev = build prod + dev images; prod-only = prod only; dev-only = single dev image used for deployment too'
        type: choice
        required: true
        default: 'prod-only'
        options:
          - 'prod+dev'
          - 'prod-only'
          - 'dev-only'
      image_prefix:
        description: 'Image name prefix (prod <prefix>:<tag>, dev <prefix>-dev:<tag>)'
        type: string
        required: true
        default: 'mydevc1'
      image_tag:
        description: 'Image tag suffix: latest (overwrites on each build) or build timestamp (UTC+8)'
        type: choice
        required: true
        default: 'latest'
        options:
          - 'latest'
          - 'timestamp'
      app_source_dir:
        description: 'Subdirectory of the project root mounted into the container as /app (default "." = whole root; the project root is passed to install.sh at install time)'
        type: string
        required: true
        default: '.'
      app_port:
        description: 'App port mapping "host:container" (e.g. 3000:3000); a single port maps the same host port. Empty = no port mapping. With nginx the app is reverse-proxied and only the container port is exposed on the app network.'
        type: string
        required: false
        default: '3000:3000'
      env_file:
        description: 'Env file(s) whose variables are injected into the app service (same as docker compose env_file), comma/space separated and relative to the project root or absolute (e.g. .env). Empty = none.'
        type: string
        required: false
        default: ''
      selinux_relabel:
        description: 'Append :z to the /app bind mount (needed on SELinux enforcing hosts)'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  build-devcontainer:
    name: Build offline dev images
    # linux-arm64 使用 ARM 原生 Runner（ubuntu-24.04-arm：公共仓库免费，
    # 私有仓库按分钟计费），免去 QEMU 模拟（速度约为原生 1/5~1/10）；
    # amd64 走标准 x86_64 Runner。
    runs-on: ${{ inputs.platform == 'linux-arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: devcontainer-pip-${{ inputs.platform }}-py${{ inputs.python_version }}-${{ inputs.pip_packages }}
          restore-keys: |
            devcontainer-pip-${{ inputs.platform }}-py${{ inputs.python_version }}-

      # 无需 QEMU：runner 架构已与目标平台一致（amd64 → x86_64 Runner，
      # arm64 → ubuntu-24.04-arm），docker build 全程原生执行
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and package
        id: build
        env:
          PLATFORM: ${{ inputs.platform }}
          PYTHON_VERSION: ${{ inputs.python_version }}
          # glibc / pip 源 / Node 版本 / npm 源固定，不再暴露为 workflow 输入
          GLIBC_VERSION: '2.28'
          PIP_MIRROR: 'pypi.org'
          PIP_PACKAGES: ${{ inputs.pip_packages }}
          APT_PACKAGES: ${{ inputs.apt_packages }}
          CUSTOM_INSTALL_CMD: ${{ inputs.custom_install_cmd }}
          ENABLE_LUCIDE: ${{ inputs.enable_lucide }}
          ENABLE_ORACLE_INSTANTCLIENT: ${{ inputs.enable_oracle_instantclient }}
          PRESET_ENVS: ${{ inputs.preset_envs }}
          ENABLE_NODE: ${{ inputs.enable_node }}
          NODE_VERSION: '24'
          NPM_PACKAGES: ${{ inputs.npm_packages }}
          NPM_REGISTRY: 'Official (npmjs.org)'
          NPM_PACKAGES_DIR: ${{ inputs.npm_packages_dir }}
          ENABLE_NGINX: ${{ contains(inputs.sidecars, 'nginx') }}
          ENABLE_POSTGRES: ${{ contains(inputs.sidecars, 'postgres') }}
          APP_DEPENDS_ON_NGINX: ${{ contains(inputs.app_depends_on, 'nginx') }}
          APP_DEPENDS_ON_POSTGRES: ${{ contains(inputs.app_depends_on, 'postgres') }}
          PROD_COMMAND: ${{ inputs.prod_command }}
          BUILD_DEV_IMAGE: ${{ inputs.image_mode == 'prod+dev' }}
          DEV_IMAGE_ONLY: ${{ inputs.image_mode == 'dev-only' }}
          IMAGE_PREFIX: ${{ inputs.image_prefix }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          APP_SOURCE_DIR: ${{ inputs.app_source_dir }}
          APP_PORT: ${{ inputs.app_port }}
          ENV_FILE: ${{ inputs.env_file }}
          SELINUX_RELABEL: ${{ inputs.selinux_relabel }}
          # 原始输入透传（供 workflow-params.json 快照记录；上方 ENABLE_NGINX 等
          # 为 contains/等值 派生布尔，不含原始值）
          SIDECARS: ${{ inputs.sidecars }}
          APP_DEPENDS_ON: ${{ inputs.app_depends_on }}
          IMAGE_MODE: ${{ inputs.image_mode }}
        run: python scripts/devcontainer-builder/main.py

      - name: Verify artifacts
        run: |
          set -euo pipefail
          echo "--- ${{ steps.build.outputs.src_name }} (top entries) ---"
          # List to a file first: piping tar into head triggers SIGPIPE (exit 2) under pipefail
          tar tzf "${{ steps.build.outputs.src_tgz }}" > /tmp/src_tgz.list
          head -30 /tmp/src_tgz.list
          echo "... $(wc -l < /tmp/src_tgz.list) entries total"
          # src 包内必须只有 compose 模板（不带渲染后的 docker-compose.yaml），
          # 由 install.sh 复制到项目根目录为 docker-compose.yml
          grep -q 'devcontainer-src/docker-compose.yml.tpl$' /tmp/src_tgz.list \
            || { echo "::error::src 包缺少 docker-compose.yml.tpl"; exit 1; }
          if grep -q 'devcontainer-src/docker-compose\.yaml$' /tmp/src_tgz.list; then
            echo "::error::src 包不应包含渲染后的 docker-compose.yaml（只保留 docker-compose.yml.tpl）"
            exit 1
          fi
          # app 服务必须显式写入 entrypoint/command：清空镜像 ENTRYPOINT/CMD，
          # 用户直接改 docker-compose.yml 即可调整启动方式（无需重建镜像）
          tar xzf "${{ steps.build.outputs.src_tgz }}" -O devcontainer-src/docker-compose.yml.tpl > /tmp/compose.start.tpl
          grep -q '^    entrypoint: \[\]$' /tmp/compose.start.tpl \
            || { echo "::error::compose 模板缺少显式 entrypoint: []（清空镜像 ENTRYPOINT）"; exit 1; }
          grep -q '^    command: \[' /tmp/compose.start.tpl \
            || { echo "::error::compose 模板缺少显式 command"; exit 1; }
          grep -q 'my-start.sh' /tmp/compose.start.tpl \
            || { echo "::error::compose 模板缺少自定义启动脚本示例"; exit 1; }
          grep -q 'devcontainer-src/main.py$' /tmp/src_tgz.list \
            || { echo "::error::src 包缺少占位 main.py"; exit 1; }
          # 项目根目录操作文件（install.sh 复制/改名到 src root）与忽略文件
          grep -q 'devcontainer-src/Makefile$' /tmp/src_tgz.list \
            || { echo "::error::src 包缺少 Makefile"; exit 1; }
          grep -q 'devcontainer-src/README.md$' /tmp/src_tgz.list \
            || { echo "::error::src 包缺少 README.md"; exit 1; }
          # bundle README 必须包含 AI Agent 使用约定（容器内开发测试，不依赖宿主机 Python）
          tar xzf "${{ steps.build.outputs.src_tgz }}" -O devcontainer-src/README.md > /tmp/readme.md
          grep -q 'AI Agent' /tmp/readme.md \
            || { echo "::error::src README.md 未包含 AI Agent 使用约定"; exit 1; }
          grep -q 'devcontainer-src/.dockerignore$' /tmp/src_tgz.list \
            || { echo "::error::src 包缺少 .dockerignore"; exit 1; }
          grep -q 'devcontainer-src/.gitignore$' /tmp/src_tgz.list \
            || { echo "::error::src 包缺少 .gitignore"; exit 1; }
          # 离线补装机制（build.sh + Dockerfile.addon）
          grep -q 'devcontainer-src/Dockerfile.addon$' /tmp/src_tgz.list \
            || { echo "::error::src 包缺少 Dockerfile.addon"; exit 1; }
          grep -q 'devcontainer-src/build.sh$' /tmp/src_tgz.list \
            || { echo "::error::src 包缺少 build.sh"; exit 1; }
          echo "--- checksum (与 Summary 表格中的 SHA256 对比) ---"
          sha256sum "${{ steps.build.outputs.src_tgz }}"
          if [ -n "${{ steps.build.outputs.install_sh }}" ]; then
            echo "--- install.sh ---"
            test -x "${{ steps.build.outputs.install_sh }}" \
              || { echo "::error::install.sh 缺少可执行权限"; exit 1; }
            bash -n "${{ steps.build.outputs.install_sh }}"
            grep -q -- '--load' "${{ steps.build.outputs.install_sh }}" \
              || { echo "::error::install.sh 缺少 --load 选项"; exit 1; }
            grep -q -- '-d|--default' "${{ steps.build.outputs.install_sh }}" \
              || { echo "::error::install.sh 缺少 -d/--default 选项"; exit 1; }
            grep -q 'SRC_ROOT="../src/"' "${{ steps.build.outputs.install_sh }}" \
              || { echo "::error::install.sh 的 -d/--default 未使用默认路径 ../src/"; exit 1; }
            sha256sum "${{ steps.build.outputs.install_sh }}"
          else
            echo "::error::install.sh 未生成"
            exit 1
          fi
          echo "--- readme.html (bundle 安装说明) ---"
          if [ -n "${{ steps.build.outputs.readme_html }}" ] && [ -s "${{ steps.build.outputs.readme_html }}" ]; then
            grep -q 'install.sh' "${{ steps.build.outputs.readme_html }}" \
              || { echo "::error::readme.html 未包含 install.sh 使用说明"; exit 1; }
            grep -q 'dist' "${{ steps.build.outputs.readme_html }}" \
              || { echo "::error::readme.html 未包含 dist/ 放置说明"; exit 1; }
            grep -q -- '--load' "${{ steps.build.outputs.readme_html }}" \
              || { echo "::error::readme.html 未包含 --load 用法说明"; exit 1; }
            grep -q 'AI Agent' "${{ steps.build.outputs.readme_html }}" \
              || { echo "::error::readme.html 未包含 AI Agent 使用约定"; exit 1; }
            head -1 "${{ steps.build.outputs.readme_html }}" | grep -q '<!DOCTYPE html>' \
              || { echo "::error::readme.html 不是 HTML 文档"; exit 1; }
            sha256sum "${{ steps.build.outputs.readme_html }}"
          else
            echo "::error::readme.html 未生成"
            exit 1
          fi
          echo "--- workflow-params.json (workflow 输入参数快照) ---"
          test -s "${{ steps.build.outputs.workflow_params_json }}" \
            || { echo "::error::workflow-params.json 未生成"; exit 1; }
          python - "${{ steps.build.outputs.workflow_params_json }}" <<'PY'
          import json, sys

          # workflow inputs 默认值（与 build-devcontainer.yml 的 inputs 保持同步）
          DEFAULTS = {
              "platform": ("linux-amd64", "choice"),
              "python_version": ("3.13", "choice"),
              "pip_packages": ("", "string"),
              "apt_packages": ("", "string"),
              "custom_install_cmd": ("", "string"),
              "enable_lucide": ("false", "boolean"),
              "enable_oracle_instantclient": ("none", "choice"),
              "preset_envs": ("", "string"),
              "enable_node": ("false", "boolean"),
              "npm_packages": ("", "string"),
              "npm_packages_dir": ("packages", "string"),
              "sidecars": ("", "string"),
              "app_depends_on": ("", "string"),
              "prod_command": ("python main.py", "string"),
              "image_mode": ("prod-only", "choice"),
              "image_prefix": ("mydevc1", "string"),
              "image_tag": ("latest", "choice"),
              "app_source_dir": (".", "string"),
              "app_port": ("3000:3000", "string"),
              "env_file": ("", "string"),
              "selinux_relabel": ("false", "boolean"),
          }
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          assert list(data) == ["minimal", "normal", "full"], list(data)
          full = data["full"]
          assert list(full) == list(DEFAULTS), list(full)
          for name, (_default, kind) in DEFAULTS.items():
              value = full[name]
              if kind == "boolean":
                  assert isinstance(value, bool), (name, value)
              else:
                  assert isinstance(value, str), (name, value)
          # normal/minimal：不允许留空字符串与 false；键集合逐层收窄
          for section in ("normal", "minimal"):
              for name, value in data[section].items():
                  assert value not in ("", False), (section, name, value)
          assert set(data["minimal"]) <= set(data["normal"]) <= set(full)
          # minimal：不允许出现取默认值的参数
          for name, value in data["minimal"].items():
              default, kind = DEFAULTS[name]
              default_value = (default.lower() == "true") if kind == "boolean" else default
              assert value != default_value, (name, value, default)
          print("workflow-params.json OK "
                f"(minimal={len(data['minimal'])}, normal={len(data['normal'])}, "
                f"full={len(full)})")
          PY
          # install.sh 只按固定清单安装文件，不应引用 workflow-params.json
          if grep -q 'workflow-params' "${{ steps.build.outputs.install_sh }}"; then
            echo "::error::install.sh 不应引用 workflow-params.json（该文件不参与安装）"
            exit 1
          fi
          sha256sum "${{ steps.build.outputs.workflow_params_json }}"
          echo "--- build.sh (from src tgz) ---"
          tar xzf "${{ steps.build.outputs.src_tgz }}" -O devcontainer-src/build.sh > /tmp/build.sh
          bash -n /tmp/build.sh
          # tar 需保留可执行位（artifact zip 解压可能丢失，文档引导 bash 调用）
          tar tvzf "${{ steps.build.outputs.src_tgz }}" devcontainer-src/build.sh \
            | grep -q '^-[rwx-]*x' \
            || { echo "::error::src 包内 build.sh 无可执行权限"; exit 1; }
          # 回归测试（离线补装）：模拟 install.sh 的根目录布局
          # （Dockerfile.addon 改名 Dockerfile、安装根目录 .dockerignore、
          #  wheels/ 放 dummy wheel），用 mock docker 干跑 build.sh，断言每次
          # 构建调用的上下文只含 wheels 且无任何 dockerignore——确保项目根
          # .dockerignore 排除 wheels/ 不会导致离线补装（COPY wheels/）失败
          echo "--- build.sh addon dry-run (mock docker) ---"
          TESTROOT=$(mktemp -d /tmp/addon-dryrun.XXXXXX)
          mkdir -p "$TESTROOT/root/docs/devcontainer" "$TESTROOT/bin" "$TESTROOT/root/wheels"
          tar xzf "${{ steps.build.outputs.src_tgz }}" -C "$TESTROOT/root/docs/devcontainer" --strip-components=1
          # 模拟 install.sh 的根目录布局：Dockerfile.addon 改名 Dockerfile、build.sh 复制到根
          cp "$TESTROOT/root/docs/devcontainer/Dockerfile.addon" "$TESTROOT/root/Dockerfile"
          cp "$TESTROOT/root/docs/devcontainer/build.sh" "$TESTROOT/root/build.sh"
          cp "$TESTROOT/root/docs/devcontainer/.dockerignore" "$TESTROOT/root/.dockerignore"
          touch "$TESTROOT/root/wheels/dummy-1.0-py3-none-any.whl"
          cat > "$TESTROOT/bin/docker" <<'MOCK'
          #!/usr/bin/env bash
          # mock docker：记录调用参数，并当场校验 build.sh 传入的构建上下文
          ctx="${*: -1}"
          echo "docker $*" >> "${MOCK_LOG:?}"
          [ "$1" = "build" ] || exit 0
          if [ -e "$ctx/.dockerignore" ] || [ -e "$ctx/Dockerfile.dockerignore" ]; then
              echo "::error::补装构建上下文不应包含 dockerignore: $ctx" >&2
              exit 1
          fi
          ls "$ctx"/wheels/*.whl >/dev/null 2>&1 \
              || { echo "::error::补装构建上下文缺少 wheels/*.whl: $ctx" >&2; exit 1; }
          exit 0
          MOCK
          chmod +x "$TESTROOT/bin/docker"
          # build.sh 按执行时 pwd 解析路径，须在项目根目录内运行
          (
            cd "$TESTROOT/root"
            MOCK_LOG="$TESTROOT/docker.log" PATH="$TESTROOT/bin:$PATH" \
              bash ./build.sh dryrun-addon > /dev/null
          )
          grep -q '^docker build ' "$TESTROOT/docker.log" \
            || { echo "::error::build.sh 未发起任何 docker build 调用"; exit 1; }
          grep -Fq -- "-f $TESTROOT/root/Dockerfile " "$TESTROOT/docker.log" \
            || { echo "::error::build.sh 未使用根目录 Dockerfile（Dockerfile.addon 改名）"; exit 1; }
          grep -q 'COPY wheels/ /tmp/addon-wheels/' "$TESTROOT/root/Dockerfile" \
            || { echo "::error::根目录 Dockerfile 不是 addon 版（缺少 COPY wheels）"; exit 1; }
          rm -rf "$TESTROOT"
          echo "addon dry-run OK: 构建上下文只含 wheels，未受根目录 .dockerignore 影响"
          echo "--- ${{ steps.build.outputs.images_name }} (docker load 用镜像归档) ---"
          # 镜像归档是 gzip 压缩的镜像归档：根目录必须能直接看到 manifest.json（或 OCI index.json）
          tar tzf "${{ steps.build.outputs.images_tgz }}" > /tmp/images.list
          head -20 /tmp/images.list
          if ! grep -qE '^(\./)?(manifest\.json|index\.json)$' /tmp/images.list; then
            echo "::error::镜像归档顶层缺少 manifest.json / index.json，docker load 会失败"
            exit 1
          fi
          sha256sum "${{ steps.build.outputs.images_tgz }}"

      # Oracle / 前端（Node/npm）参数联动校验：确保生成物真的按参数接线
      - name: Verify oracle / npm wiring
        env:
          ORACLE_MODE: ${{ inputs.enable_oracle_instantclient }}
          NODE_ENABLED: ${{ inputs.enable_node }}
          DEV_ENABLED: ${{ inputs.build_dev_image || inputs.dev_image_only }}
          SRC_TGZ: ${{ steps.build.outputs.src_tgz }}
          INSTALL_SH: ${{ steps.build.outputs.install_sh }}
          README_HTML: ${{ steps.build.outputs.readme_html }}
        run: |
          set -euo pipefail
          tar xzf "$SRC_TGZ" -O devcontainer-src/docker-compose.yml.tpl > /tmp/compose.tpl
          tar xzf "$SRC_TGZ" -O devcontainer-src/Dockerfile > /tmp/Dockerfile
          tar xzf "$SRC_TGZ" -O devcontainer-src/Makefile > /tmp/Makefile

          if [ "$ORACLE_MODE" = "runtime_deps_only" ]; then
            grep -q 'ORACLE_CLIENT_DIR:-/opt/oracle/instantclient19' /tmp/compose.tpl \
              || { echo "::error::compose 模板缺少 Oracle 客户端挂载"; exit 1; }
            grep -q 'ORACLE_HOME' /tmp/compose.tpl \
              || { echo "::error::compose 模板缺少 Oracle 环境变量"; exit 1; }
            grep -q 'ORACLE_HOME=/opt/oracle/instantclient19' /tmp/Dockerfile \
              || { echo "::error::Dockerfile 缺少 Oracle 环境变量"; exit 1; }
            if grep -q 'instantclient-basic' /tmp/Dockerfile; then
              echo "::error::runtime_deps_only 模式不应把 Oracle 客户端下载进镜像"
              exit 1
            fi
            grep -q 'ORACLE_CLIENT_DIR' "$INSTALL_SH" \
              || { echo "::error::install.sh 缺少 Oracle 配置提示"; exit 1; }
            grep -q 'ORACLE_CLIENT_DIR' "$README_HTML" \
              || { echo "::error::readme.html 缺少 Oracle 配置提示"; exit 1; }
            echo "oracle wiring OK (runtime_deps_only)"
          elif [ "$ORACLE_MODE" = "full" ]; then
            grep -q 'instantclient-basic' /tmp/Dockerfile \
              || { echo "::error::full 模式 Dockerfile 缺少 Oracle 客户端下载"; exit 1; }
            grep -q 'ORACLE_HOME=/opt/oracle/instantclient19' /tmp/Dockerfile \
              || { echo "::error::Dockerfile 缺少 Oracle 环境变量"; exit 1; }
            if grep -q 'ORACLE_CLIENT_DIR' /tmp/compose.tpl; then
              echo "::error::full 模式客户端已打进镜像，compose 不应再挂载"
              exit 1
            fi
            grep -q 'ORACLE_HOME' "$INSTALL_SH" \
              || { echo "::error::install.sh 缺少 Oracle 安装提示"; exit 1; }
            grep -q 'Oracle Instant Client' "$README_HTML" \
              || { echo "::error::readme.html 缺少 Oracle 安装提示"; exit 1; }
            echo "oracle wiring OK (full)"
          fi

          if [ "$NODE_ENABLED" = "true" ]; then
            grep -q 'COPY --from=node' /tmp/Dockerfile \
              || { echo "::error::Dockerfile 缺少 Node.js 安装层"; exit 1; }
            grep -q 'NPM_PACKAGES_DIR:-' /tmp/compose.tpl \
              || { echo "::error::compose 模板缺少 npm 离线包挂载"; exit 1; }
            grep -q '/opt/npm-packages' /tmp/compose.tpl \
              || { echo "::error::compose 模板缺少 /opt/npm-packages 挂载点"; exit 1; }
            grep -q 'NPM_PACKAGES_DIR' "$INSTALL_SH" \
              || { echo "::error::install.sh 缺少 npm 离线包提示"; exit 1; }
            grep -q '/opt/npm-packages' "$README_HTML" \
              || { echo "::error::readme.html 缺少 npm 离线包提示"; exit 1; }
            if [ "$DEV_ENABLED" = "true" ]; then
              grep -q 'npm-install' /tmp/Makefile \
                || { echo "::error::Makefile 缺少 npm-install 目标"; exit 1; }
            fi
            echo "npm wiring OK"
          fi

      # 安装脚本：构建时已 chmod 755，此处显式再确认一次
      # （注：artifact zip 解压后可能丢失 +x，文档统一引导用户 bash install.sh 调用）
      - name: Make install.sh executable
        run: chmod +x "${{ steps.build.outputs.install_sh }}"

      # Artifacts 只能是 zip 封装：设 compression-level 0 让 zip 只做存储，
      # 避免 tgz 再被 zip 二次压缩。唯一产物
      # <image_prefix>_devcontainer_<架构>_<时间戳>（架构 amd64/arm64），
      # zip 内含镜像归档 tgz、src tgz、install.sh、readme.html 与
      # workflow-params.json 五个文件
      - name: Upload bundle artifact (docker images tgz + src tgz + install.sh + readme.html + workflow-params.json)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.bundle_name }}
          path: |
            ${{ steps.build.outputs.images_tgz }}
            ${{ steps.build.outputs.src_tgz }}
            ${{ steps.build.outputs.install_sh }}
            ${{ steps.build.outputs.readme_html }}
            ${{ steps.build.outputs.workflow_params_json }}
          compression-level: 0
          if-no-files-found: error
